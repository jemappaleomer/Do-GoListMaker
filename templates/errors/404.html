{% extends "base.html" %}

{% block title %}Sayfa Bulunamadı (404) - Do&Go List Maker{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center text-center px-4">
    <div class="w-20 h-20 bg-emerald-50 text-emerald-600 rounded-3xl flex items-center justify-center mb-6 shadow-sm ring-8 ring-emerald-50/50">
        <i data-lucide="compass" class="w-10 h-10 animate-pulse"></i>
    </div>

    <span class="text-xs font-bold uppercase tracking-wider text-emerald-600 bg-emerald-100/60 px-3 py-1 rounded-full mb-3">404 Hatası</span>
    <h1 class="text-3xl sm:text-4xl font-black text-slate-900 tracking-tight mb-3">Rotayı Şaşırmış Olabilirsin!</h1>
    <p class="text-sm sm:text-base text-slate-500 max-w-md mb-8">
        Aradığın liste, sayfa veya içerik taşınmış, silinmiş ya da hiç var olmamış olabilir.
    </p>

    <div class="flex flex-col sm:flex-row items-center gap-3">
        <a href="/" class="w-full sm:w-auto inline-flex items-center justify-center space-x-2 px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-sm hover:shadow transition-all text-sm">
            <i data-lucide="home" class="w-4 h-4"></i>
            <span>Ana Sayfaya Dön</span>
        </a>
        <a href="/faq" class="w-full sm:w-auto inline-flex items-center justify-center space-x-2 px-6 py-3 bg-white hover:bg-slate-100 text-slate-700 font-semibold rounded-xl border border-slate-200 transition-all text-sm">
            <i data-lucide="help-circle" class="w-4 h-4"></i>
            <span>Yardım & SSS</span>
        </a>
    </div>
</div>
{% endblock %}
