{% extends "base.html" %}

{% block title %}Giriş Yap - Do&Go{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-8 sm:mt-12">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-900">Tekrar Hoş Geldin!</h1>
            <p class="text-sm text-slate-500 mt-1">Listelerine ve planlarına devam etmek için giriş yap.</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl flex items-center space-x-2">
            <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="/auth/login" method="POST" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">E-posta Adresi</label>
                <input type="email" id="email" name="email" required 
                       class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-sm"
                       placeholder="ornek@mail.com">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Parola</label>
                <input type="password" id="password" name="password" required 
                       class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-sm"
                       placeholder="••••••••">
            </div>

            <button type="submit" 
                    class="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-xl shadow-sm transition duration-150">
                Giriş Yap
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-slate-500">
            Hesabın yok mu? 
            <a href="/auth/register" class="text-emerald-600 font-medium hover:underline">Hemen Kayıt Ol</a>
        </div>
    </div>
</div>
{% endblock %}
