<!DOCTYPE html>
<html lang="tr" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Do&Go List Maker{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="flex flex-col min-h-full font-sans antialiased text-slate-800">
    <!-- Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-2 text-xl font-bold tracking-tight text-slate-900 group">
                <span class="p-2 bg-emerald-500 text-white rounded-xl shadow-sm group-hover:scale-105 transition-transform">
                    <i data-lucide="check-square" class="w-5 h-5"></i>
                </span>
                <span>Do<span class="text-emerald-600">&</span>Go</span>
            </a>

            <div class="flex items-center space-x-4">
                {% if user %}
                    <span class="text-sm font-medium text-slate-600 hidden sm:inline-flex items-center space-x-1.5 bg-slate-100 px-3 py-1.5 rounded-full">
                        <i data-lucide="user" class="w-4 h-4 text-slate-400"></i>
                        <span>{{ user.username }}</span>
                    </span>
                    <a href="/lists" class="text-sm font-medium text-slate-700 hover:text-emerald-600 transition-colors">Listelerim</a>
                    <a href="/auth/logout" class="text-sm font-medium text-red-600 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg transition-colors">Çıkış Yap</a>
                {% else %}
                    <a href="/auth/login" class="text-sm font-medium text-slate-700 hover:text-emerald-600 transition-colors">Giriş Yap</a>
                    <a href="/auth/register" class="text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 px-4 py-2 rounded-xl shadow-sm hover:shadow transition-all">Kayıt Ol</a>
                {% endif %}
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-sm text-slate-400">
        <div class="max-w-5xl mx-auto px-4">
            Do&Go List Maker &copy; 2026 — Arkadaşlarla organize olmanın en kolay yolu.
        </div>
    </footer>

    <script>
        lucide.createIcons();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
